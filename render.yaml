services:
  - type: web
    name: uiforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install "poetry==1.8.0" && poetry config virtualenvs.create false && poetry install --without dev --no-interaction --no-ansi
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: IS_PROD
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
